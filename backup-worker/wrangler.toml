name = "mom-masale-backup-worker"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Same D1 database as the main mom-masale-website Pages project — a D1
# database isn't tied to a single Worker/Pages project, it can be bound
# from multiple deployments at once. This is the exact database_id from
# the main project's wrangler.toml; don't regenerate it.
[[d1_databases]]
binding = "DB"
database_name = "mom-masale-db"
database_id = "cb5dcc52-dc4c-4439-8107-d38078479a00"

# Dedicated bucket for backups, separate from IMAGES (product photos) and
# CAREER_FILES (private CVs). Create it before first deploy — see the
# setup steps in README.md in this directory.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "mom-masale-backups"

# Weekly, Sunday 3:00 AM UTC.
[triggers]
crons = ["0 3 * * SUN"]
